<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunaiku dashboard – component configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-bg:#EDEFF3;--c-panel:#FFFFFF;--c-ink:#1B2230;--c-muted:#5E6778;--c-line:#D9DDE5;--c-accent:#2A3550;--c-on-accent:#FFFFFF;--c-field:#F4F5F8;--c-on:#2E9E6A;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--c-bg:#14171D;--c-panel:#1D222A;--c-ink:#E6E9EF;--c-muted:#9AA3B2;--c-line:#2E3542;--c-accent:#C9D2E3;--c-on-accent:#14171D;--c-field:#252B35;--c-on:#4CC38A;color-scheme:dark}
}
:root[data-theme="dark"]{--c-bg:#14171D;--c-panel:#1D222A;--c-ink:#E6E9EF;--c-muted:#9AA3B2;--c-line:#2E3542;--c-accent:#C9D2E3;--c-on-accent:#14171D;--c-field:#252B35;--c-on:#4CC38A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--c-bg);color:var(--c-ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}

.app{display:grid;grid-template-columns:270px 1fr 360px;grid-template-areas:"left stage right";height:100%}
.left{grid-area:left;background:var(--c-panel);border-right:1px solid var(--c-line);overflow-y:auto;padding:20px 16px 40px}
.right{grid-area:right;background:var(--c-panel);border-left:1px solid var(--c-line);overflow-y:auto;padding:20px 16px 48px}
.stage{grid-area:stage;display:flex;flex-direction:column;min-width:0;overflow:auto}
h2{font-size:16px;margin:0 0 2px;letter-spacing:-.01em}
.lede{color:var(--c-muted);margin:0 0 16px;font-size:13px}

.comp{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.comp li{display:flex;align-items:center;gap:8px;border:1px solid var(--c-line);border-radius:10px;padding:8px 8px 8px 10px;background:var(--c-panel)}
.comp li.fixed{background:var(--c-field);color:var(--c-muted)}
.comp .nm{flex:1;font-weight:600;font-size:13px;line-height:1.3}
.comp li.off .nm{color:var(--c-muted)}
.lock{font-size:11px;font-weight:600;border:1px solid var(--c-line);border-radius:6px;padding:2px 6px}
.sw{position:relative;width:36px;height:22px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--c-line);pointer-events:none;transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--c-on)}
.sw input:checked+span::after{transform:translateX(14px)}
.sw input:focus-visible+span{outline:2px solid var(--c-accent);outline-offset:2px}
.mini{border:1px solid var(--c-line);background:var(--c-panel);border-radius:6px;width:26px;height:26px;cursor:pointer;display:grid;place-items:center;flex:none;font-size:12px}
.mini:disabled{opacity:.3;cursor:default}
.note{margin-top:14px;font-size:12px;color:var(--c-muted)}
.note button{border:0;background:none;padding:0;color:var(--c-ink);text-decoration:underline;cursor:pointer;font-weight:600}

details{border:1px solid var(--c-line);border-radius:10px;margin-bottom:8px;background:var(--c-panel)}
details[open]{background:var(--c-field)}
details.flash{box-shadow:0 0 0 2px var(--c-accent)}
summary{cursor:pointer;padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--c-muted);border-bottom:1.5px solid var(--c-muted);transform:rotate(45deg);transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c-line);flex:none}
.dot.on{background:var(--c-on)}
.sub{font-size:11px;color:var(--c-muted);font-weight:600;margin:6px 0 -2px}
.fields{padding:2px 12px 12px;display:grid;gap:10px}
.f{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.f.stack{grid-template-columns:1fr;gap:4px}
.f label{color:var(--c-muted);font-size:13px}
.f select,.f input[type=text],.f input[type=number],.f input[type=date]{background:var(--c-panel);border:1px solid var(--c-line);border-radius:7px;padding:5px 8px;min-width:130px;max-width:180px}
.f.stack input[type=text],.f textarea{max-width:none;width:100%}
.f textarea{background:var(--c-panel);border:1px solid var(--c-line);border-radius:7px;padding:6px 8px;resize:vertical;min-height:58px;line-height:1.4}
.f input[type=color]{width:44px;height:28px;border:1px solid var(--c-line);border-radius:7px;padding:2px;background:var(--c-panel);cursor:pointer}
.f .rng{display:flex;align-items:center;gap:8px}
.f input[type=range]{width:110px;accent-color:var(--c-accent)}
.f output{font-variant-numeric:tabular-nums;font-size:12px;color:var(--c-muted);min-width:48px;text-align:right}
.f input[type=checkbox]{width:18px;height:18px;accent-color:var(--c-accent)}
.help{font-size:11.5px;color:var(--c-muted);margin-top:-4px}

.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px;background:var(--c-bg);border-bottom:1px solid var(--c-line)}
.tb{border:1px solid var(--c-line);background:var(--c-panel);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600}
.tb[aria-pressed=true]{border-color:var(--c-accent);box-shadow:inset 0 0 0 1px var(--c-accent)}
.bar select{border:1px solid var(--c-line);background:var(--c-panel);border-radius:9px;padding:7px 10px}
.bar .sp{flex:1}
.canvas{flex:1;display:grid;place-items:center;padding:28px 16px 48px}

.phone{
  --pri:#46A000;--brand:#1E7BE0;--bg:#F0F6FD;--tx:#212121;--tx2:#616161;--warn:#FFB35C;--dng:#E8505B;--r:16px;--br:6px;
  width:min(var(--dev-w),calc(100vw - 32px));height:var(--dev-h);
  border:10px solid #1A1D24;border-radius:40px;overflow:hidden;position:relative;
  background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;
  display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(15,20,35,.45);
}
.phone *{box-sizing:border-box}
.ph-status{height:24px;flex:none;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 12px;font-size:12px;font-weight:500}
.ph-top{height:56px;flex:none;background:#fff;display:flex;align-items:center;padding:0 16px;box-shadow:0 2px 4px rgba(0,0,0,.12);position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:6px;font:italic 700 22px/1 Roboto,sans-serif;letter-spacing:-.01em}
.logo .g{color:#8DBE3F}.logo .b{color:#3E78C2}
.ph-scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.ph-nav{flex:none;display:flex;background:#fff;box-shadow:0 -1px 4px rgba(0,0,0,.08);padding:8px 0 10px;position:relative;z-index:2}
.ph-nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#757575}
.ph-nav div.on{color:var(--brand)}
.ph-nav svg{width:22px;height:22px}
.el{position:relative}
.inspect .el{cursor:pointer}
.inspect .el:hover{outline:2px dashed var(--brand);outline-offset:3px;border-radius:var(--r)}
.inspect .el:hover::before{content:attr(data-name);position:absolute;top:-6px;right:6px;transform:translateY(-100%);font:600 10px/1 "Plus Jakarta Sans",sans-serif;background:var(--brand);color:#fff;padding:3px 6px;border-radius:4px;z-index:3}
.empty-ph{margin:auto;color:var(--tx2);text-align:center;font-size:13px;padding:24px}

.card{background:#fff;border-radius:var(--r);box-shadow:0 1px 5px rgba(0,0,0,.14);padding:16px}
.c-title{font-weight:700;font-size:15px;margin:0 0 4px;color:var(--tx)}
.c-body{color:var(--tx2);font-size:13px;letter-spacing:.01em;margin:0}
.btn{font:500 14px/1 Roboto,sans-serif;letter-spacing:.07em;border-radius:var(--br);cursor:pointer;height:36px;padding:0 16px;border:1.5px solid transparent;background:none;color:var(--pri)}
.btn.text{padding:0 8px}
.btn.outline{border-color:var(--pri)}
.btn.secondary{background:#fff;border:1.5px solid var(--pri);color:var(--pri);height:44px;width:100%;font-weight:600}
.btn.filled{background:var(--pri);color:#fff;height:44px;width:100%;font-weight:500}
.btn.filled:disabled{background:#CDD0D6;color:#fff;cursor:not-allowed}
.btn.link{padding:0;height:auto}

/* hope card */
.hope{display:flex;align-items:center;gap:14px}
.hope-img{width:56px;height:56px;border-radius:14px;flex:none;object-fit:contain;background:#E8F5E2}
.hope-txt .c-title{font-size:14px;margin-bottom:2px}
.hope-txt .c-body{font-size:12px;line-height:1.4}

/* action steps */
.act-list{display:flex;flex-direction:column;gap:0}
.act-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #EEF0F4}
.act-item:last-child{border-bottom:none;padding-bottom:0}
.act-item:first-child{padding-top:4px}
.act-ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:16px}
.act-ic.profile{background:#E8F0FE;color:var(--brand)}
.act-ic.reminder{background:#FFF3E0;color:#F59E0B}
.act-ic.device{background:#E8F5E2;color:var(--pri)}
.act-label{flex:1;font-size:13px;font-weight:500;color:var(--tx)}
.act-check{width:20px;height:20px;border-radius:50%;border:2px solid #D1D5DB;flex:none;display:grid;place-items:center}
.act-check.done{border-color:var(--pri);background:var(--pri);color:#fff}
.act-toggle{position:relative;width:34px;height:20px;border-radius:999px;background:#D1D5DB;flex:none;cursor:pointer}
.act-toggle.on{background:var(--pri)}
.act-toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.act-toggle.on::after{transform:translateX(14px)}
.act-arrow{color:#9CA3AF;flex:none;font-size:14px}
/* grouped action step v2 */
.ga-wrap{display:flex;flex-direction:column;gap:16px}
.ga-reason{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:14px 16px}
.ga-rlbl{font-size:12px;color:var(--tx2)}
.ga-rtxt{font-size:15px;font-weight:600;color:var(--tx);margin:4px 0 10px;line-height:1.4}
.ga-rlink{border:0;background:none;padding:0;color:var(--pri);font:500 13px/1.2 Roboto,sans-serif;cursor:pointer}
.ga-card{padding:16px}
.ga-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.ga-title{font-size:15px;font-weight:500;color:var(--tx)}
.ga-badge{font-size:12px;font-weight:500;background:#FFF6D6;color:#7A5B00;border-radius:6px;padding:3px 8px;white-space:nowrap;flex:none}
.ga-badge.all{background:#E8F5E2;color:var(--pri)}
.ga-step{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #EEF0F4}
.ga-step:last-child,.ga-step:has(+ .ga-note){border-bottom:none}
.ga-num{width:24px;height:24px;border-radius:50%;border:1.5px solid #BDBDBD;font-size:12px;font-weight:600;color:var(--tx2);display:grid;place-items:center;flex:none}
.ga-num.done{background:var(--pri);border-color:var(--pri)}
.ga-txt{flex:1;min-width:0}
.ga-lbl{font-size:14px;font-weight:500;color:var(--tx);line-height:1.3}
.ga-desc{font-size:12px;color:var(--tx2);line-height:1.4;margin-top:3px}
.ga-btn{flex:none;height:38px;padding:0 14px;border:1.5px solid var(--pri);border-radius:8px;background:#fff;color:var(--pri);font:500 13px/1 Roboto,sans-serif;cursor:pointer}
.ga-step .act-toggle{width:44px;height:26px}
.ga-step .act-toggle::after{width:22px;height:22px}
.ga-step .act-toggle.on::after{transform:translateX(18px)}
.ga-note{display:flex;gap:8px;align-items:flex-start;background:#FFF8E1;border-radius:10px;padding:12px;font-size:12.5px;color:var(--tx);line-height:1.45;margin-top:6px}
.ga-note svg{flex:none;margin-top:1px;color:var(--tx2)}

/* literacy */
.lit-card{padding:12px}
.lit-hero{width:100%;aspect-ratio:1983/793;object-fit:cover;border-radius:12px;display:block;margin-bottom:12px;background:#EAF3FB}
.lit-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:#E8F0FE;border-radius:999px;padding:4px 12px;margin-bottom:10px}
.lit-title{font-size:17px;font-weight:700;color:var(--tx);margin:0 0 6px;line-height:1.25}
.lit-body{font-size:14px;margin:0 0 12px;line-height:1.5}
.lit-div{height:1px;background:#EEF0F4;margin:0 0 12px}
.lit-cta{border:0;background:none;padding:0;color:var(--pri);font:700 15px/1.2 Roboto,sans-serif;cursor:pointer}

/* score */
.score-wrap{padding:16px}
.sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sc-title{font-size:18px;font-weight:700;color:var(--tx)}
.sc-info{border:0;background:none;padding:0;color:#9AA3B2;cursor:pointer;display:grid;place-items:center}
.sc-info svg{width:22px;height:22px}
/* liquid gauge */
.sc-gwrap{position:relative;width:160px;height:160px;margin:6px auto 16px;display:grid;place-items:center;border-radius:50%}
.sc-gwrap::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px var(--sc-faint),0 0 26px 3px var(--sc-glow)}
.sc-gauge{position:relative;width:140px;height:140px;border-radius:50%;overflow:hidden;background:#FFFEFA;box-shadow:inset 0 0 0 4px var(--sc-ring)}
.sc-liquid{position:absolute;left:0;right:0;bottom:0;height:var(--fill);animation:scfill 1.1s cubic-bezier(.33,.9,.4,1)}
.sc-liquid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--sc-w1),var(--sc-w2))}
.sc-wave{position:absolute;left:-50%;top:-12px;width:200%;height:18px;fill:var(--sc-w1);animation:scwave 2.6s linear infinite}
.sc-wave.b{top:-8px;fill:var(--sc-w2);opacity:.75;animation-duration:3.6s;animation-direction:reverse}
@keyframes scwave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes scfill{from{height:0}to{height:var(--fill)}}
.sc-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:2}
.sc-val{font-size:40px;font-weight:800;color:var(--tx);line-height:1;font-variant-numeric:tabular-nums}
.sc-pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 14px;background:var(--sc-pill-bg);color:var(--sc-pill-tx)}
.sc-gwrap.sc-good{--sc-ring:#46A000;--sc-faint:#BBE3A1;--sc-glow:rgba(70,160,0,.45);--sc-w1:#8BD45E;--sc-w2:#46A000;--sc-pill-bg:#E8F5E2;--sc-pill-tx:#2E7D00}
.sc-gwrap.sc-fair{--sc-ring:#F5C01A;--sc-faint:#FBE7A1;--sc-glow:rgba(245,192,26,.55);--sc-w1:#FFDE59;--sc-w2:#F5C01A;--sc-pill-bg:#FEF6CC;--sc-pill-tx:#B7791F}
.sc-gwrap.sc-poor{--sc-ring:#E8505B;--sc-faint:#F6B9BE;--sc-glow:rgba(232,80,91,.45);--sc-w1:#F58A92;--sc-w2:#E8505B;--sc-pill-bg:#FEE2E2;--sc-pill-tx:#C0343F}
.score-label{font-size:13px;color:var(--tx2);margin-bottom:2px}
.score-prog{margin-top:4px;text-align:left;background:#EEF2F7;border-radius:14px;padding:14px 16px}
.sc-prog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.score-prog-title{font-size:15px;font-weight:700;color:var(--tx)}
.sc-prog-pct{font-size:16px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums}
.prog-bar{height:9px;border-radius:999px;background:#D7DEE8;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;border-radius:999px;background:#F5C01A;animation:scprog 1s cubic-bezier(.33,.9,.4,1)}
@keyframes scprog{from{width:0}}
.prog-label{font-size:13px;color:var(--tx2)}

/* referral */
.ref-card{padding:16px}
.ref-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ref-ic{width:40px;height:40px;border-radius:12px;background:#E8F0FE;display:grid;place-items:center;flex:none}
.ref-ic svg{width:22px;height:22px}
.ref-info{display:flex;align-items:center}
.ref-partner{font-weight:700;font-size:14px;color:var(--tx)}

/* rejection */
.rej-card{padding:16px}
.rej-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rej-warn-ic{font-size:20px;flex:none;line-height:1}
.rej-reason{background:#FEF2F2;border-radius:8px;padding:10px 12px;font-size:13px;color:#B91C1C;margin-bottom:12px;line-height:1.45}
.rej-acts{display:flex;flex-direction:column;gap:10px}
.rej-act{display:flex;align-items:flex-start;gap:10px}
.rej-act .act-check{margin-top:2px}
.rej-act-txt{display:flex;flex-direction:column;gap:1px}
.rej-act-label{font-size:13px;font-weight:600;color:var(--tx)}
.rej-act-desc{font-size:12px;color:var(--tx2);line-height:1.4}

/* risk profile */
.rp-card{padding:16px}
.rp-rows{display:flex;flex-direction:column;gap:0;margin-top:8px}
.rp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEF0F4}
.rp-row:last-child{border-bottom:none;padding-bottom:0}
.rp-row-left{flex:1;display:flex;flex-direction:column;gap:1px}
.rp-label{font-size:13px;font-weight:600;color:var(--tx)}
.rp-desc{font-size:11.5px;color:var(--tx2);line-height:1.35}
.rp-badge{font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;flex:none;white-space:nowrap}

/* locked limit */
.ll-card{padding:16px}
.ll-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ll-lock-ic{font-size:28px;flex:none;line-height:1}
.ll-label{font-size:13px;color:var(--tx2);display:flex;align-items:center}
.ll-amt{font-size:24px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ll-reason{background:#FFF3E0;border-radius:8px;padding:10px 12px;font-size:13px;color:#92400E;margin-bottom:8px;line-height:1.45}
.ll-date{font-size:12px;color:var(--tx2);margin-top:4px}
.ll-date b{color:var(--tx)}

/* in-phone page view */
.pg-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:3}
.pg-back{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none;font-size:16px;color:var(--tx)}
.pg-title{font-size:15px;font-weight:700;color:var(--tx);flex:1}
.pg-body{padding:16px;display:flex;flex-direction:column;gap:16px;background:#fff;min-height:100%}

/* dummy page (blue app bar) */
.dpg-bar{display:flex;align-items:center;gap:16px;background:var(--brand);color:#fff;padding:14px 16px 20px}
.dpg-back{border:0;background:none;padding:0;color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.dpg-title{font-size:17px;font-weight:700;flex:1;color:#fff;line-height:1.2}
.dpg-ic{flex:none;color:#fff;display:grid;place-items:center}
.dpg-body{background:#fff;border-radius:18px 18px 0 0;margin-top:-10px;min-height:620px}
.dpg-ph{color:#C2C8D2;font-size:13px;text-align:center;padding:48px 24px 0}

/* profile page fields */
.pf-field{display:flex;flex-direction:column;gap:3px}
.pf-label{font-size:12px;color:var(--tx2);font-weight:500}
.pf-val{font-size:14px;color:var(--tx);background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:10px 12px}
.pf-val.empty{color:var(--dng);border-color:#FECACA;background:#FEF2F2}
.pf-val.ok{border-color:#BBF7D0;background:#F0FDF4}
.pf-section{font-size:13px;font-weight:700;color:var(--tx);margin-top:4px}

/* permission page */
.perm-row{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(20,35,59,.06)}
.perm-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:#E8F0FE}
.perm-info{flex:1}
.perm-name{font-size:15px;font-weight:700;color:#13233B}
.perm-status{font-size:13px;margin-top:1px}
.perm-status.allow{color:var(--pri)}
.perm-status.deny{color:var(--tx2)}
.perm-badge{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px;flex:none}
.perm-badge.allow{background:#DFF3E0;color:#2E7D32}
.perm-badge.deny{background:#EEF1F5;color:#8A93A3}
.perm-toggle{width:46px;height:27px}
.perm-toggle::after{width:23px;height:23px}
.perm-toggle.on::after{transform:translateX(19px)}

/* KTP form (profile) */
.kf-scroll{overflow-y:auto}
.kf-title{font-size:19px;font-weight:800;color:#13233B;line-height:1.3;margin:0;padding:16px 16px 0}
.kf-body{padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.kf-field{display:flex;flex-direction:column;gap:8px}
.kf-label{font-size:15px;font-weight:700;color:#13233B}
.kf-input{border:1px solid #D7DEE8;border-radius:10px;padding:13px 14px;font-size:15px;color:var(--tx);background:#fff;width:100%;font-family:inherit}
.kf-input::placeholder{color:#9AA3B2}
.kf-input:disabled{background:#F4F6F9;color:#6B7483}
.kf-select,.kf-date{display:flex;align-items:center;justify-content:space-between;border:1px solid #D7DEE8;border-radius:10px;padding:13px 14px;font-size:15px;color:#6B7483;background:#F4F6F9}
.kf-select .chev,.kf-date .chev{color:#9AA3B2;display:grid;place-items:center}
.kf-radios{display:flex;flex-wrap:wrap;gap:14px 28px}
.kf-radio{display:flex;align-items:center;gap:10px;font-size:15px;color:#6B7483}
.kf-dot{width:22px;height:22px;border-radius:50%;border:2px solid #CBD2DC;flex:none;display:grid;place-items:center}
.kf-dot.on{border-color:var(--pri)}
.kf-dot.on::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--pri)}
.kf-sec{height:8px;background:#F1F3F6;border-top:1px solid #EAEDF2;border-bottom:1px solid #EAEDF2}
.kf-sec-title{font-size:16px;font-weight:800;color:#13233B;margin:0}
.kf-sec-sub{font-size:13px;color:var(--tx2);margin:3px 0 0;line-height:1.4}
.kf-cta{margin-top:6px}

/* stepper article page */
.step-item{display:flex;gap:12px;position:relative}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none;z-index:1}
.step-line{position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#E5E7EB}
.step-item:last-child .step-line{display:none}
.step-content{flex:1;padding-bottom:20px}
.step-content h4{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--tx)}
.step-content p{margin:0;font-size:13px;color:var(--tx2);line-height:1.5}
.step-img{width:100%;height:80px;border-radius:8px;margin-top:8px;display:grid;place-items:center;font-size:24px}

/* risk profile detail page */
.rpd-illus{width:100%;height:100px;border-radius:12px;background:linear-gradient(135deg,#FFF3E0 0%,#FEE2E2 50%,#E8F5E2 100%);display:grid;place-items:center;font-size:36px;margin-bottom:12px}
.rpd-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}
.rpd-card h4{margin:0 0 4px;font-size:14px;font-weight:600}
.rpd-card p{margin:0;font-size:13px;color:var(--tx2);line-height:1.5}

/* locked limit tips dialog */
.tips-list{text-align:left;margin:12px 0}
.tips-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid #EEF0F4}
.tips-item:last-child{border-bottom:none}
.tips-ic{font-size:16px;flex:none;margin-top:1px}
.tips-txt{font-size:13px;color:var(--tx2);line-height:1.45}

/* referral v2 */
.ref2-card{padding:20px 18px}
.ref2-illus{width:130px;height:130px;display:block;margin:0 auto 14px}
.ref2-title{font-size:22px;font-weight:800;color:#13233B;margin:0 0 10px;line-height:1.22}
.ref2-body{font-size:14px;line-height:1.5;margin:0 0 12px}

/* lenders page */
.lp-header{display:flex;align-items:center;background:#fff;box-shadow:none;padding:14px 12px;position:sticky;top:0;z-index:3}
.lp-header .pg-back{background:transparent;color:var(--tx)}
.lp-htitle{flex:1;text-align:center;font-size:17px;font-weight:700;color:var(--tx);margin-right:34px}
.lp-body{background:#fff;padding:4px 16px 20px;min-height:100%}
.lp-h1{font-size:22px;font-weight:800;color:#13233B;margin:8px 0 4px;line-height:1.2}
.lp-sub{font-size:14px;color:var(--tx2);margin:0 0 16px;line-height:1.45}
.lp-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 6px rgba(20,35,59,.08)}
.lp-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lp-logo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#F0F3F7}
.lp-name{font-size:16px;font-weight:700;color:#13233B;line-height:1.2}
.lp-type{font-size:13px;color:var(--tx2)}
.lp-amtlbl{font-size:13px;color:var(--tx2)}
.lp-amt{font-size:22px;font-weight:800;color:#13233B;margin:1px 0 12px;font-variant-numeric:tabular-nums}
.lp-row{display:flex;align-items:center;gap:12px}
.lp-col{display:flex;flex-direction:column;gap:2px}
.lp-col.tenor{min-width:82px}
.lp-col.rate{flex:1}
.lp-k{font-size:12px;color:var(--tx2)}
.lp-v{font-size:14px;font-weight:600;color:var(--tx)}
.lp-btn{flex:none;height:40px;padding:0 18px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:700 14px/1 Roboto,sans-serif;cursor:pointer}
.lp-foot{font-size:12px;color:var(--tx2);text-align:center;margin:6px 0 0;line-height:1.4}

/* risk profile illustration */
.rp-illus{width:100%;height:80px;border-radius:10px;background:linear-gradient(135deg,#FFF3E0 0%,#FEE2E2 50%,#E8F5E2 100%);margin-bottom:8px;display:grid;place-items:center;font-size:32px}
/* risk gauge card */
.rp2-card{padding:16px}
.rp2-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.rp2-title{font-size:18px;font-weight:800;color:#13233B}
.rp2-gauge{position:relative;margin:4px 0 2px}
.rp2-pill{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:14px;font-weight:800;letter-spacing:.03em;border-radius:999px;padding:8px 20px;white-space:nowrap}
.rp2-pill.low{background:#E8F5E2;color:#2E7D32}
.rp2-pill.medium{background:#FDEBCF;color:#B45309}
.rp2-pill.high{background:#FEE2E2;color:#C0343F}
.rp2-sub{font-size:14px;color:#3F4A5A;text-align:center;line-height:1.5;margin:10px 4px 14px}

/* loan slider */
.ln-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.ln-row span{color:var(--tx2);font-size:13px}
.ln-row b{font-size:16px;font-variant-numeric:tabular-nums}
.ln-mm{display:flex;justify-content:space-between;font-size:11px;color:#9AA1A9;margin-top:-2px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:2px 0 0;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--pri) var(--pct),#DDE5EE var(--pct))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--pri);margin-top:-8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rng::-moz-range-track{height:6px;border-radius:3px;background:#DDE5EE}
.rng::-moz-range-progress{height:6px;border-radius:3px;background:var(--pri)}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--pri)}
.rng:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.inst{margin-top:16px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--pri) 8%,#fff)}
.inst-top{display:flex;justify-content:space-between;align-items:baseline}
.inst-top span{font-size:13px;color:var(--tx2)}
.inst-top b{font-size:20px;color:var(--pri);font-variant-numeric:tabular-nums}
.inst dl{margin:8px 0 0;display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:12px;color:var(--tx2)}
.inst dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
.ln-cta{margin-top:16px}
.ln-dis{font-size:12px;color:var(--tx2);margin:8px 0 0;text-align:center}
.ln-reminder{display:flex;gap:8px;align-items:flex-start;background:#FFF8E1;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12.5px;color:var(--tx);line-height:1.45}
.ln-reminder svg{flex:none;margin-top:1px;color:#F59E0B}
/* slider v2 */
.sl-card{padding:18px 16px}
.sl-greet{font-size:20px;font-weight:800;color:#141414;line-height:1.3;margin:0 0 18px}
.sl-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.sl-lbl{font-size:15px;font-weight:600;color:var(--tx)}
.sl-val{font-size:19px;font-weight:800;color:#141414;font-variant-numeric:tabular-nums}
.sl-track{display:flex;align-items:center;gap:12px}
.sl-track .rng{flex:1}
.sl-end{font-size:14px;color:var(--tx2);font-variant-numeric:tabular-nums;flex:none;min-width:16px;text-align:center}
.sl-div{border-top:1.5px dashed #D3D9E2;margin:18px 0}
.sl-cic{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sl-cic-label{font-size:15px;font-weight:700;color:var(--tx)}
.sl-pill{font-size:20px;font-weight:800;color:var(--pri);background:#EAF7E6;border-radius:12px;padding:8px 16px;font-variant-numeric:tabular-nums}
.sl-bd{margin:10px 0 0;display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:12px;color:var(--tx2)}
.sl-bd dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
.sl-field-label{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:8px;display:block}
.sl-select{display:flex;align-items:center;justify-content:space-between;border:1px solid #D7DEE8;border-radius:10px;padding:13px 14px;font-size:15px;color:#9AA3B2;background:#fff}
.sl-select .chev{color:#9AA3B2;display:grid;place-items:center;transform:rotate(90deg)}
.sl-card .rng::-webkit-slider-thumb{width:24px;height:24px;border-width:3px;margin-top:-9px}
.sl-card .rng::-moz-range-thumb{width:18px;height:18px}
/* reminder */
.rm-card{padding:16px}
.rm-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.rm-lbl{font-size:14px;color:var(--tx2)}
.rm-days{font-size:26px;font-weight:800;color:#141414;margin-top:2px}
.rm-date{font-size:14px;color:var(--tx2)}
.rm-bar{height:7px;border-radius:999px;background:#E3F0FB;overflow:hidden;margin-bottom:16px}
.rm-fill{height:100%;border-radius:999px;background:var(--brand)}
.rm-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rm-rlbl{font-size:15px;font-weight:700;color:var(--tx)}
.rm-rdesc{font-size:13px;color:var(--tx2);margin-top:1px}
.rm-row .act-toggle{width:46px;height:27px}
.rm-row .act-toggle::after{width:23px;height:23px}
.rm-row .act-toggle.on::after{transform:translateX(19px)}
/* banner julo */
.bj-card{position:relative;background:#DADCF7;border-radius:16px;padding:18px 16px;overflow:hidden;min-height:118px}
.bj-txt{max-width:64%}
.bj-title{font-size:17px;font-weight:800;color:#141414;margin:0 0 8px}
.bj-body{font-size:14px;color:#2B3342;line-height:1.5;margin:0}
.bj-brand{color:var(--pri);font-weight:700}
.bj-mascot{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:120px;height:120px}
/* tips */
.tp-card{background:#FFF7E0;border-radius:16px;padding:18px 16px}
.tp-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.tp-bulb{width:48px;height:48px;flex:none;display:grid;place-items:center}
.tp-bulb img{width:48px;height:48px}
.tp-title{font-size:17px;font-weight:800;color:#141414;margin:0}
.tp-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.tp-row:last-child{margin-bottom:0}
.tp-icwrap{position:relative;flex:none}
.tp-num{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;z-index:1}
.tp-ic{width:52px;height:52px;display:grid;place-items:center}
.tp-ic img{width:52px;height:52px}
.tp-txt{font-size:14px;color:#2B3342;line-height:1.45;margin:0;padding-top:5px}

/* preapproved */
.pre-lbl{font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.pre-amt{font-size:26px;font-weight:700;color:var(--tx);margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pre .c-body{margin-bottom:16px}
.chip-ok{font-size:11px;font-weight:500;color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,#fff);border-radius:999px;padding:2px 8px}
/* preapproved v2 */
.pa-card{padding:0;overflow:hidden}
.pa-top{position:relative;background:linear-gradient(135deg,#EDE7FB 0%,#F3EFFB 45%,#FBFCFE 100%);padding:18px 16px 20px;border-radius:var(--r) var(--r) 16px 16px;min-height:132px}
.pa-illus{position:absolute;top:4px;right:2px;width:112px;height:104px;object-fit:contain}
.pa-badge{display:inline-block;font-size:13px;font-weight:700;color:var(--pri);background:#E3F3DD;border-radius:999px;padding:5px 14px;margin-bottom:10px}
.pa-label{font-size:16px;color:var(--tx2);font-weight:500}
.pa-amt{font-size:29px;font-weight:800;color:#141414;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pa-body{font-size:14px;color:#3F4A5A;line-height:1.55;margin:14px 16px 16px}
.pa-card .btn.filled{width:calc(100% - 32px);margin:0 16px 16px}

.ovl{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:24px;z-index:10}
.mdl{background:#fff;border-radius:var(--r);padding:24px 20px 16px;text-align:center;width:100%;max-width:300px}
.mdl-ic{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 12%,#fff);color:var(--brand)}
.mdl p{margin:6px 0 18px;color:var(--tx2);font-size:14px}
.mdl p.c-title{color:var(--tx);font-size:16px;margin:0}
.mdl b{color:var(--tx)}
.toast{position:absolute;left:16px;right:16px;bottom:76px;background:#323232;color:#fff;font-size:13px;padding:10px 14px;border-radius:6px;z-index:9}

dialog{border:1px solid var(--c-line);border-radius:14px;background:var(--c-panel);color:var(--c-ink);width:min(560px,calc(100vw - 32px));padding:18px}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog h3{margin:0 0 4px;font-size:16px}
dialog p{margin:0 0 10px;color:var(--c-muted);font-size:13px}
dialog textarea{width:100%;height:320px;background:var(--c-field);border:1px solid var(--c-line);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.dlg-a{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.dlg-a .pri{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.err{color:#C62E3A;font-size:12px;min-height:16px}

@media(max-width:1180px){
  html,body{height:auto}
  .app{grid-template-columns:260px 1fr;grid-template-areas:"left stage" "left right";height:auto;min-height:100%}
  .right{border-left:0;border-top:1px solid var(--c-line);overflow:visible}
  .left{overflow:visible}
  .left>div{position:sticky;top:16px}
  .stage{overflow:visible}
  .bar{top:env(safe-area-inset-top,0px)}
}
@media(max-width:760px){
  .app{grid-template-columns:1fr;grid-template-areas:"stage" "left" "right"}
  .left{border-right:0;border-top:1px solid var(--c-line)}
  .left>div{position:static}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const KEY="tunaiku-dash-config-v6";
const clone=o=>JSON.parse(JSON.stringify(o));
function merge(base,over){
  if(Array.isArray(base)) return Array.isArray(over)?over.filter(x=>base.includes(x)).concat(base.filter(x=>!over.includes(x))):base;
  if(typeof base!=="object"||base===null) return (over===undefined||typeof over!==typeof base)?base:over;
  const out={}; for(const k in base) out[k]=merge(base[k],over?over[k]:undefined); return out;
}
function load(){ try{ const s=localStorage.getItem(KEY); return s?merge(DEFAULTS,JSON.parse(s)):clone(DEFAULTS);}catch(e){return clone(DEFAULTS);} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(cfg)); }catch(e){} }
const get=(o,p)=>p.split(".").reduce((a,k)=>a?.[k],o);
function set(o,p,v){ const ks=p.split("."), last=ks.pop(); ks.reduce((a,k)=>a[k],o)[last]=v; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ui={amt:null,ten:null,modal:false,tips:false,inspect:false,toast:"",page:"",profileName:""};

const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const jt=x=>"Rp"+(+x).toLocaleString("id-ID",{maximumFractionDigits:2})+" jt";
const ddmmyyyy=d=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||""); return m?m[3]+"-"+m[2]+"-"+m[1]:"dd-mm-yyyy"; };
const pct=(v,min,max)=>max>min?((v-min)/(max-min)*100).toFixed(2)+"%":"0%";
function range(min,max,step){ min=+min; max=+max; step=+step||1; if(max<=min) max=min+step; return {min,max,step}; }
const snap=(v,r)=>{ v=Math.min(Math.max(+v,r.min),r.max); return +(r.min+Math.round((v-r.min)/r.step)*r.step).toFixed(4); };
function calc(){
  const s=cfg.slider, P=ui.amt*1e6, n=ui.ten, r=(+s.rate||0)/100;
  const pokok=P/n, bunga=P*r, cicilan=Math.ceil((pokok+bunga)/100)*100;
  return {pokok,bunga,cicilan,total:cicilan*n};
}
function clampUI(){
  const s=cfg.slider, A=range(s.minAmt,s.maxAmt,s.stepAmt), T=range(s.minTen,s.maxTen,s.stepTen);
  ui.amt=snap(ui.amt??s.defAmt,A); ui.ten=snap(ui.ten??s.defTen,T); return {A,T};
}

const phone=document.getElementById("phone");
function applyTheme(){ const t=cfg.theme;
  const v={"--pri":t.primary,"--brand":t.brand,"--bg":t.background,"--tx":t.text,"--tx2":t.muted,"--warn":t.warning,"--r":t.cardRadius+"px","--br":t.buttonRadius+"px"};
  for(const k in v) phone.style.setProperty(k,v[k]); }
function render(){
  applyTheme();
  const old=phone.querySelector(".ph-scroll"), keep=old?old.scrollTop:0;
  var inner="";
  if(ui.page){
    inner='<div class="ph-status"><span>&#x25BE; &#x25E2; &#x25AE;</span><span>12:30</span></div>'+
      '<div class="ph-scroll" style="padding:0;background:#fff">'+pageHTML(ui.page)+'</div>';
  } else {
    const body=cfg.order.filter(k=>cfg.show[k]).map(k=>{ const h=C[k](); return h?'<section class="el" data-el="'+k+'" data-name="'+NAMES[k]+'">'+h+'</section>':""; }).join("");
    inner='<div class="ph-status"><span>&#x25BE; &#x25E2; &#x25AE;</span><span>12:30</span></div>'+
      '<header class="ph-top"><div class="logo">'+ic.logo+'<span><span class="g">tunai</span><span class="b">ku</span></span></div></header>'+
      '<div class="ph-scroll">'+(body||'<p class="empty-ph">No component on. Turn one on in the left pane.</p>')+'</div>'+
      '<nav class="ph-nav"><div class="on">'+ic.home+'Pinjamanku</div><div>'+ic.doc+'Riwayat</div><div>'+ic.help+'Bantuan</div><div>'+ic.user+'Profil</div></nav>';
  }
  phone.innerHTML=inner+
    (ui.toast?'<div class="toast" role="status">Prototype: "'+esc(ui.toast)+'" tapped</div>':"")+
    (ui.modal?modalHTML():"")+(ui.tips?tipsHTML():"");
  phone.classList.toggle("inspect",ui.inspect&&!ui.page);
  if(!ui.page){ const ns=phone.querySelector(".ph-scroll"); if(ns) ns.scrollTop=keep; }
  phone.querySelector(".mdl .btn")?.focus();
  animateScore();
}
var scLast;
function animateScore(){ const el=phone.querySelector(".sc-val"); if(!el) return;
  const target=+el.dataset.score;
  if(scLast===target){ el.textContent=target; return; }
  scLast=target; var start=null, from=Math.round(target*0.4), dur=900;
  function step(t){ if(start===null)start=t; var p=Math.min((t-start)/dur,1);
    el.textContent=Math.round(from+(target-from)*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(step); else el.textContent=target; }
  requestAnimationFrame(step);
}
function updateSlider(){ const k=calc(), q=s=>phone.querySelector('[data-o="'+s+'"]');
  if(!q("amt")) return;
  q("amt").textContent=ui.amt+" Juta"; q("ten").textContent=ui.ten+" Bulan"; q("cicilan").textContent=rp(k.cicilan);
  if(q("pokok")){ q("pokok").textContent=rp(k.pokok); q("bunga").textContent=rp(k.bunga); q("total").textContent=rp(k.total); } }

var toastT;
phone.addEventListener("input",e=>{
  const nm=e.target.closest(".pf-name"); if(nm){ ui.profileName=nm.value; const b=phone.querySelector(".kf-cta"); if(b) b.disabled=!nm.value.trim(); return; }
  const r=e.target.closest(".rng"); if(!r) return;
  ui[r.dataset.k]=+r.value; r.style.setProperty("--pct",pct(+r.value,+r.min,+r.max)); updateSlider(); });
phone.addEventListener("click",e=>{
  if(ui.inspect && !ui.page){ const s=e.target.closest(".el"); if(s){ e.preventDefault(); openSection(s.dataset.el); return; } }
  const pt=e.target.closest(".perm-toggle"); if(pt){ cfg.actions.step3Done=true; save(); renderRight(); render(); return; }
  const rt=e.target.closest('[data-act="rtoggle"]'); if(rt){ cfg.reminder.on=!cfg.reminder.on; save(); renderRight(); render(); return; }
  const tgl=e.target.closest(".act-toggle"); if(tgl){
    const idx=tgl.dataset.idx;
    if(idx==="1"){ cfg.actions.step1On=!cfg.actions.step1On; save(); renderRight(); render(); return; }
  }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="close" && a.classList.contains("ovl") && e.target!==a) return;
  if(act==="modal") ui.modal=true;
  if(act==="close"){ ui.modal=false; ui.tips=false; }
  if(act==="tips") ui.tips=true;
  if(act==="page"){ ui.page=a.dataset.v||""; }
  if(act==="back"){ ui.page=""; }
  if(act==="profilesave"){ const nm=phone.querySelector(".pf-name"); if(nm && !nm.value.trim()) return; ui.profileName=""; cfg.actions.step2Done=true; save(); renderRight(); ui.page=""; }
  if(act==="toast"){ ui.toast=a.dataset.v; clearTimeout(toastT); toastT=setTimeout(function(){ui.toast="";render();},1800); }
  render();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(ui.modal||ui.tips){ ui.modal=false; ui.tips=false; render(); } else if(ui.page){ ui.page=""; render(); } } });

const left=document.getElementById("left");
function renderLeft(){ const o=cfg.order;
  left.innerHTML='<h2>Components</h2><p class="lede">Turn on, off, reorder. Top and bottom bars stay fixed.</p>'+
  '<ul class="comp">'+
    '<li class="fixed"><span class="nm">Top bar</span><span class="lock">Fixed</span></li>'+
    o.map((k,i)=>'<li class="'+(cfg.show[k]?"":"off")+'"><label class="sw" title="Show '+NAMES[k]+'"><input type="checkbox" data-show="'+k+'" '+(cfg.show[k]?"checked":"")+' aria-label="Show '+NAMES[k]+'"><span></span></label><span class="nm">'+NAMES[k]+'</span><button class="mini" data-mv="'+i+'" data-d="-1" '+(i===0?"disabled":"")+' aria-label="Move up">&#x2191;</button><button class="mini" data-mv="'+i+'" data-d="1" '+(i===o.length-1?"disabled":"")+' aria-label="Move down">&#x2193;</button></li>').join("")+
    '<li class="fixed"><span class="nm">Bottom bar</span><span class="lock">Fixed</span></li>'+
  '</ul>';
}
left.addEventListener("change",e=>{ const k=e.target.dataset.show; if(!k) return; cfg.show[k]=e.target.checked; save(); renderLeft(); renderRight(); render(); });
left.addEventListener("click",e=>{
  const b=e.target.closest("[data-mv]"); if(!b) return;
  const i=+b.dataset.mv, j=i+ +b.dataset.d, o=cfg.order; [o[i],o[j]]=[o[j],o[i]];
  save(); renderLeft(); render();
});

const right=document.getElementById("right");
function field(f){
  if(f.s) return '<div class="sub">'+f.s+'</div>';
  if(f.h) return '<div class="help">'+f.h+'</div>';
  const v=get(cfg,f.p), id="f-"+f.p.replace(/\./g,"-"); var ctl="", stack=false;
  if(f.t==="color") ctl='<input id="'+id+'" type="color" data-p="'+f.p+'" data-t="str" value="'+v+'">';
  else if(f.t==="range") ctl='<span class="rng"><input id="'+id+'" type="range" data-p="'+f.p+'" data-t="num" min="'+f.min+'" max="'+f.max+'" step="'+(f.step||1)+'" value="'+v+'"><output>'+v+(f.u||"")+'</output></span>';
  else if(f.t==="num") ctl='<input id="'+id+'" type="number" data-p="'+f.p+'" data-t="num" min="'+f.min+'" max="'+f.max+'" step="'+(f.step||1)+'" value="'+v+'">';
  else if(f.t==="select") ctl='<select id="'+id+'" data-p="'+f.p+'" data-t="'+(typeof v==="number"?"num":"str")+'">'+f.o.map(o=>'<option '+(o==v?"selected":"")+'>'+o+'</option>').join("")+'</select>';
  else if(f.t==="bool") ctl='<input id="'+id+'" type="checkbox" data-p="'+f.p+'" data-t="bool" '+(v?"checked":"")+'">';
  else if(f.t==="date") ctl='<input id="'+id+'" type="date" data-p="'+f.p+'" data-t="str" value="'+esc(v)+'">';
  else if(f.t==="area"){ stack=true; ctl='<textarea id="'+id+'" data-p="'+f.p+'" data-t="str" rows="3">'+esc(v)+'</textarea>'; }
  else { stack=f.l.length>14; ctl='<input id="'+id+'" type="text" data-p="'+f.p+'" data-t="str" value="'+esc(v)+'">'; }
  return '<div class="f '+(stack?"stack":"")+'" data-u="'+(f.u||"")+'"><label for="'+id+'">'+f.l+'</label>'+ctl+'</div>';
}
function renderRight(){
  const open=[...right.querySelectorAll("details[open]")].map(d=>d.id);
  const sec=(id,g,dot)=>'<details id="sec-'+id+'" '+(open.includes("sec-"+id)?"open":"")+'><summary>'+(dot!==undefined?'<span class="dot '+(dot?"on":"")+'"></span>':"")+''+g.n+'</summary><div class="fields">'+g.f.map(field).join("")+'</div></details>';
  right.innerHTML='<h2>Element settings</h2><p class="lede">Content, behavior and states for each component.</p>'
    + cfg.order.map(k=>sec(k,SCHEMA[k],cfg.show[k])).join("") + sec("theme",SCHEMA.theme);
}
right.addEventListener("input",e=>{
  const el=e.target.closest("[data-p]"); if(!el) return;
  if(el.type==="number" && el.value==="") return;
  const t=el.dataset.t, val=t==="bool"?el.checked:t==="num"?+el.value:el.value;
  set(cfg,el.dataset.p,val);
  const out=el.parentElement.querySelector("output"); if(out) out.textContent=val+el.closest(".f").dataset.u;
  if(/^slider\.(def|min|max|step)/.test(el.dataset.p)){ if(/def/.test(el.dataset.p)){ ui.amt=null; ui.ten=null; } }
  save(); render();
});
function openSection(k){ const d=document.getElementById("sec-"+k); if(!d) return;
  d.open=true; d.scrollIntoView({behavior:"smooth",block:"start"}); d.classList.add("flash"); setTimeout(()=>d.classList.remove("flash"),900);
  d.querySelector("input,select,textarea")?.focus({preventScroll:true}); }

const insp=document.getElementById("inspect");
insp.onclick=()=>{ ui.inspect=!ui.inspect; insp.setAttribute("aria-pressed",ui.inspect); render(); };
const dev=document.getElementById("device");
function setDevice(){ const [w,h]=dev.value.split("x"); phone.style.setProperty("--dev-w",w+"px"); phone.style.setProperty("--dev-h",h+"px"); try{localStorage.setItem(KEY+"-dev",dev.value);}catch(e){} }
try{ const d=localStorage.getItem(KEY+"-dev"); if(d && [...dev.options].some(o=>o.value===d)) dev.value=d; }catch(e){}
dev.onchange=setDevice;
document.getElementById("resetBtn").onclick=()=>{ cfg=clone(DEFAULTS); Object.assign(ui,{amt:null,ten:null,modal:false,tips:false,page:""}); save(); renderLeft(); renderRight(); render(); };
const dlg=document.getElementById("dlg"), ta=document.getElementById("json"), jerr=document.getElementById("jsonErr");
document.getElementById("exportBtn").onclick=()=>{ ta.value=JSON.stringify(cfg,null,2); jerr.textContent=""; dlg.showModal(); };
document.getElementById("closeDlg").onclick=()=>dlg.close();
document.getElementById("copyJson").onclick=async()=>{ try{ await navigator.clipboard.writeText(ta.value); jerr.textContent="Copied."; }catch(e){ ta.select(); jerr.textContent="Selected. Press Ctrl/Cmd+C."; } };
document.getElementById("applyJson").onclick=()=>{ try{ cfg=merge(DEFAULTS,JSON.parse(ta.value)); ui.amt=ui.ten=null; save(); renderLeft(); renderRight(); render(); dlg.close(); }catch(e){ jerr.textContent="Invalid JSON: "+e.message; } };

setDevice(); renderLeft(); renderRight(); render();
</script>
